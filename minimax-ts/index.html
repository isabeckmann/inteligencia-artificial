<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo da Velha - Minimax IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    h1 { margin-bottom: 10px; }
    #status {
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .tabuleiro {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      background-color: #333;
      border: 3px solid #333;
      border-radius: 8px;
    }
    .celula {
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .celula:hover { background-color: #f0f0f0; }
    .celula.ocupada { cursor: not-allowed; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
    }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <h1>Jogo da Velha (com IA Minimax)</h1>
  <div id="status">Sua vez (Você é o X)</div>

  <div class="tabuleiro" id="tabuleiro">
    <div class="celula" data-index="0"></div>
    <div class="celula" data-index="1"></div>
    <div class="celula" data-index="2"></div>
    <div class="celula" data-index="3"></div>
    <div class="celula" data-index="4"></div>
    <div class="celula" data-index="5"></div>
    <div class="celula" data-index="6"></div>
    <div class="celula" data-index="7"></div>
    <div class="celula" data-index="8"></div>
  </div>

  <button id="reiniciar">Reiniciar Jogo</button>

  <script type="module" src="./dist/ui.js"></script>
</body>
</html>
